<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="存錢罐">
<meta name="theme-color" content="#2B5BE0">
<meta name="description" content="記錄每次抵抗慾望省下的錢，累積存入你的存錢罐">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>慾望抵抗存錢罐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F5F0; --surface: #FFFFFF; --surface2: #F0EDE6;
    --border: rgba(0,0,0,0.08); --text1: #1A1814; --text2: #6B6660; --text3: #A8A5A0;
    --accent: #2B5BE0; --accent-light: #EBF0FF;
    --gold: #D4920A; --gold-light: #FFF7E0;
    --green: #1A7A4A; --green-light: #E6F7EE;
    --danger: #E03A2B; --danger-light: #FFEDEB;
    --radius: 16px; --radius-sm: 10px;
    --tr: background 0.25s, color 0.25s, border-color 0.25s;
  }
  html.dark {
    --bg: #0F0F0F; --surface: #1C1C1E; --surface2: #2C2C2E;
    --border: rgba(255,255,255,0.1); --text1: #F2F2F7; --text2: #A0A0A8; --text3: #55555C;
    --accent: #5B8AF5; --accent-light: #1A2550;
    --gold: #F0A820; --gold-light: #2A2010;
    --green: #34C77A; --green-light: #0D2A1A;
    --danger: #FF5A4A; --danger-light: #2A100E;
  }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text1); min-height: 100vh; padding: 0 0 120px; transition: var(--tr); }
  .theme-toggle { background: var(--surface2); border: 1px solid var(--border); border-radius: 100px; padding: 5px 12px; font-size: 14px; font-family: inherit; color: var(--text2); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: var(--tr); line-height: 1.4; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 20px 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  header p { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .main { padding: 20px 16px; }

  /* streak */
  .streak-bar { background: var(--gold-light); border: 1px solid rgba(212,146,10,0.2); border-radius: var(--radius-sm); padding: 12px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .streak-fire { font-size: 26px; }
  .streak-text { flex: 1; }
  .streak-title { font-size: 14px; font-weight: 700; color: var(--gold); }
  .streak-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }

  /* jar name */
  .jar-name-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
  .jar-name-display { font-size: 16px; font-weight: 700; color: var(--text1); cursor: pointer; border-bottom: 1.5px dashed var(--text3); padding-bottom: 1px; }
  .jar-name-input { font-size: 16px; font-weight: 700; font-family: inherit; border: none; border-bottom: 1.5px solid var(--accent); background: transparent; color: var(--text1); text-align: center; outline: none; width: 180px; display: none; }

  /* jar section */
  .jar-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }

  /* milestones */
  .milestones { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
  .milestone { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .milestone-dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.3s; }
  .milestone-dot.reached { background: var(--gold-light); border-color: var(--gold); transform: scale(1.1); }
  .milestone-label { font-size: 10px; color: var(--text3); font-weight: 500; }

  /* stats */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; border: 1px solid var(--border); }
  .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.2px; }
  .stat-val { font-size: 20px; font-weight: 700; color: var(--text1); letter-spacing: -0.5px; }
  .stat-val.accent { color: var(--accent); }

  /* goal bar */
  .goal-card { background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 14px 16px; margin-bottom: 20px; }
  .goal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .goal-top-label { font-size: 13px; color: var(--text2); font-weight: 500; }
  .goal-top-val { font-size: 13px; font-weight: 700; color: var(--accent); }
  .goal-track { height: 10px; background: var(--surface2); border-radius: 100px; overflow: hidden; }
  .goal-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 100px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }

  /* add card */
  .add-card { background: var(--surface); border-radius: var(--radius); padding: 18px 16px; border: 1px solid var(--border); margin-bottom: 20px; }
  .add-card h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--text1); }
  .field-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .field-row input { flex: 1; height: 48px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0 14px; font-size: 16px; font-family: inherit; background: var(--bg); color: var(--text1); outline: none; -webkit-appearance: none; }
  .field-row input:focus { border-color: var(--accent); background: var(--surface); }
  .field-row input::placeholder { color: var(--text3); }
  input#item-amount { width: 120px; flex: none; }
  .btn-add { width: 100%; height: 52px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer; letter-spacing: 0.3px; transition: opacity 0.15s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
  .btn-add:active { opacity: 0.85; transform: scale(0.98); }

  /* completed jars */
  .completed-section { margin-bottom: 20px; }
  .section-label { font-size: 13px; color: var(--text2); font-weight: 500; margin-bottom: 10px; }
  .completed-jars { display: flex; flex-wrap: wrap; gap: 10px; }
  .completed-jar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .cj-icon { font-size: 22px; }
  .cj-info { }
  .cj-name { font-size: 13px; font-weight: 700; color: var(--text1); }
  .cj-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }

  /* log */
  .log-header { font-size: 13px; color: var(--text2); font-weight: 500; margin-bottom: 10px; letter-spacing: 0.3px; }
  .log-list { display: flex; flex-direction: column; gap: 8px; }
  .log-item { background: var(--surface); border-radius: var(--radius-sm); padding: 14px; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; animation: slideIn 0.2s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .log-icon { width: 36px; height: 36px; background: var(--gold-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .log-info { flex: 1; min-width: 0; }
  .log-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text1); }
  .log-date { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .log-amount { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
  .log-del { background: none; border: none; font-size: 20px; color: var(--text3); cursor: pointer; padding: 4px; flex-shrink: 0; -webkit-tap-highlight-color: transparent; line-height: 1; }
  .log-del:active { color: var(--danger); }
  .empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 15px; line-height: 1.8; }
  .empty-icon { font-size: 40px; display: block; margin-bottom: 10px; }

  /* toast */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text1); color: #fff; padding: 12px 22px; border-radius: 100px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* confetti */
  .confetti-piece { position: fixed; width: 10px; height: 10px; border-radius: 2px; pointer-events: none; z-index: 999; animation: confettiFall linear forwards; }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* full overlay */
  .full-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .full-overlay.show { opacity: 1; pointer-events: all; }
  .overlay-card { background: var(--surface); border-radius: var(--radius); padding: 32px 28px; text-align: center; max-width: 300px; width: 90%; transform: scale(0.9); transition: transform 0.3s; }
  .full-overlay.show .overlay-card { transform: scale(1); }
  .overlay-emoji { font-size: 56px; display: block; margin-bottom: 12px; }
  .overlay-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .overlay-sub { font-size: 14px; color: var(--text2); margin-bottom: 24px; line-height: 1.6; }
  .overlay-btn { width: 100%; height: 52px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 17px; font-weight: 700; font-family: inherit; cursor: pointer; }

  .auth-loading{position:fixed;inset:0;background:var(--bg);z-index:600;display:flex;align-items:center;justify-content:center;font-size:28px;transition:opacity 0.2s;}
  .auth-loading.hidden{opacity:0;pointer-events:none;}
  .login-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
  .login-screen.hidden{display:none;}
  .login-logo{font-size:52px;margin-bottom:14px;}
  .login-title{font-size:22px;font-weight:700;margin-bottom:6px;}
  .login-sub{font-size:14px;color:var(--text2);margin-bottom:28px;text-align:center;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;width:100%;max-width:360px;}
  .login-field{margin-bottom:12px;}
  .login-field label{font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:5px;}
  .login-field input{width:100%;height:46px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 14px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--text1);outline:none;-webkit-appearance:none;}
  .login-field input:focus{border-color:var(--accent);}
  .login-field input::placeholder{color:var(--text3);}
  .login-btn{width:100%;height:50px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px;}
  .login-btn:active{opacity:0.82;}
  .login-err{font-size:13px;color:#E03A2B;margin-top:10px;text-align:center;min-height:18px;}
  .app-screen{display:none;}
  .app-screen.visible{display:block;}
  .logout-btn-hdr{background:none;border:1px solid var(--border);border-radius:100px;padding:5px 12px;font-size:13px;font-family:inherit;color:var(--text2);cursor:pointer;}
</style>
</head>
<body>

<div class="auth-loading" id="auth-loading">⏳</div>

<div class="login-screen hidden" id="login-screen">
  <div class="login-logo">🏦</div>
  <div class="login-title">慾望抵抗存錢罐</div>
  <div class="login-sub">忍住沒買的每一筆，都是你的勝利</div>
  <div class="login-card">
    <div class="login-field"><label>電子信箱</label><input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email"/></div>
    <div class="login-field"><label>密碼</label><input type="password" id="auth-password" placeholder="密碼" autocomplete="current-password"/></div>
    <button class="login-btn" onclick="doAuth()">登入</button>
    <div class="login-err" id="auth-err"></div>
  </div>
</div>

<div class="app-screen" id="app-screen">

<header style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;">
  <h1 style="font-size:17px;font-weight:700;white-space:nowrap;">慾望抵抗存錢罐 🏦</h1>
  <div style="display:flex;gap:6px;">
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
    <button class="theme-toggle" id="install-btn" onclick="triggerInstall()" style="display:none;">📲 安裝</button>
    <button class="logout-btn-hdr" onclick="doLogout()">登出</button>
  </div>
</header>

<div class="main">

  <div class="streak-bar" id="streak-bar">
    <div class="streak-fire" id="streak-fire">🔥</div>
    <div class="streak-text">
      <div class="streak-title" id="streak-title">連續 0 天有紀錄</div>
      <div class="streak-sub" id="streak-sub">今天還沒有紀錄，加油！</div>
    </div>
  </div>

  <div class="jar-name-row">
    <span class="jar-name-display" id="jar-name-display" onclick="editJarName()" title="點擊編輯">第 1 罐</span>
    <input class="jar-name-input" id="jar-name-input" maxlength="12" onblur="saveJarName()" onkeydown="if(event.key==='Enter')saveJarName()"/>
  </div>

  <div class="jar-section">
    <svg id="jar-svg" width="140" height="180" viewBox="0 0 140 180" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="jar-fill" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
          <stop offset="0" stop-color="#2B5BE0" stop-opacity="0.25" id="gs1"/>
          <stop offset="0" stop-color="#2B5BE0" stop-opacity="0" id="gs2"/>
        </linearGradient>
        <clipPath id="jar-clip">
          <rect x="20" y="28" width="100" height="130" rx="22"/>
        </clipPath>
      </defs>
      <rect x="44" y="8" width="52" height="18" rx="6" fill="#D4C8B0"/>
      <rect x="48" y="10" width="44" height="14" rx="5" fill="#E8DFC8"/>
      <rect x="20" y="28" width="100" height="130" rx="22" fill="#FAFAF7" stroke="#E0D8CC" stroke-width="1.5"/>
      <rect x="20" y="28" width="100" height="130" rx="22" fill="url(#jar-fill)"/>
      <rect x="30" y="38" width="18" height="70" rx="9" fill="white" opacity="0.25"/>
      <line x1="40" y1="72" x2="100" y2="72" stroke="#E0D8CC" stroke-width="0.8"/>
      <line x1="36" y1="96" x2="104" y2="96" stroke="#E0D8CC" stroke-width="0.8"/>
      <line x1="34" y1="120" x2="106" y2="120" stroke="#E0D8CC" stroke-width="0.8"/>
      <line x1="36" y1="144" x2="104" y2="144" stroke="#E0D8CC" stroke-width="0.8"/>
      <text x="70" y="97" text-anchor="middle" font-size="16" fill="#2B5BE0" font-weight="700" font-family="'Noto Sans TC', sans-serif" id="jar-total">$0</text>
      <text x="70" y="116" text-anchor="middle" font-size="11" fill="#8899CC" font-family="'Noto Sans TC', sans-serif" id="jar-pct">0%</text>
    </svg>
  </div>

  <div class="milestones">
    <div class="milestone">
      <div class="milestone-dot" id="m25" title="25%">⚡</div>
      <div class="milestone-label">25%</div>
    </div>
    <div class="milestone">
      <div class="milestone-dot" id="m50" title="50%">🌟</div>
      <div class="milestone-label">50%</div>
    </div>
    <div class="milestone">
      <div class="milestone-dot" id="m75" title="75%">🔥</div>
      <div class="milestone-label">75%</div>
    </div>
    <div class="milestone">
      <div class="milestone-dot" id="m100" title="滿罐">🏆</div>
      <div class="milestone-label">滿罐</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">累計存入</div>
      <div class="stat-val accent" id="s-total">$0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">抵抗次數</div>
      <div class="stat-val" id="s-count">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">最大單筆</div>
      <div class="stat-val" id="s-max">—</div>
    </div>
  </div>

  <div class="goal-card">
    <div class="goal-top">
      <span class="goal-top-label">目標進度</span>
      <span class="goal-top-val" id="goal-label">$0 / $3,000</span>
    </div>
    <div class="goal-track">
      <div class="goal-fill" id="goal-bar"></div>
    </div>
  </div>

  <div class="add-card">
    <h2>記錄一筆抵抗</h2>
    <div class="field-row">
      <input type="text" id="item-name" placeholder="商品名稱（選填）" autocomplete="off"/>
      <input type="number" id="item-amount" placeholder="金額" min="1" inputmode="numeric"/>
    </div>
    <button class="btn-add" onclick="addItem()">存入存錢罐</button>
  </div>

  <div class="completed-section" id="completed-section" style="display:none;">
    <div class="section-label">已完成的罐子 🏺</div>
    <div class="completed-jars" id="completed-jars"></div>
  </div>

  <div class="log-header" id="log-header"></div>
  <div class="log-list" id="log-list">
    <div class="empty"><span class="empty-icon">🐷</span>還沒有紀錄<br>快去抵抗第一個慾望吧！</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="full-overlay" id="full-overlay">
  <div class="overlay-card">
    <span class="overlay-emoji">🎉</span>
    <div class="overlay-title" id="overlay-title">恭喜！存滿了！</div>
    <div class="overlay-sub" id="overlay-sub">你成功抵抗慾望，存滿了這個罐子！<br>繼續開下一罐吧！</div>
    <button class="overlay-btn" onclick="startNewJar()">開始第 <span id="next-jar-num">2</span> 罐 🚀</button>
  </div>
</div>

<script>
  // theme
  (function(){
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
    function updateBtn() {
      const isDark = document.documentElement.classList.contains('dark');
      const btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = isDark ? '☀️ 淺色' : '🌙 深色';
    }
    window.toggleTheme = function() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateBtn();
    };
    document.addEventListener('DOMContentLoaded', updateBtn);
  })();

  const GOAL = 3000;
  const COLORS = ['#E03A2B','#2B5BE0','#1A7A4A','#D4920A','#8B2FC9','#E05F2B'];

  let state = { records: [], completedJars: [], currentJarName: '', currentJarNum: 1 };
  let currentUser = null;

  function save() {
    if (!currentUser) return;
    import('https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js').then(({getFirestore, doc, setDoc}) => {
      const db = getFirestore();
      setDoc(doc(db, 'jars', currentUser.uid), { state: JSON.stringify(state) });
    });
  }

  function startListening() {
    if (!currentUser) return;
    import('https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js').then(({getFirestore, doc, onSnapshot}) => {
      const db = getFirestore();
      onSnapshot(doc(db, 'jars', currentUser.uid), (snap) => {
        if (snap.exists()) {
          try {
            const loaded = JSON.parse(snap.data().state || '{}');
            state = loaded;
            if (!state.completedJars) state.completedJars = [];
            if (!state.currentJarNum) state.currentJarNum = 1;
            if (state.currentJarName === undefined) state.currentJarName = '';
            if (!state.records) state.records = [];
          } catch(e){}
        }
        render();
      });
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function calcStreak() {
    if (!state.records.length) return 0;
    const today = new Date();
    const toKey = d => d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate();
    const days = new Set(state.records.map(r => r.date));
    let streak = 0;
    let d = new Date(today);
    while (true) {
      if (days.has(toKey(d))) { streak++; d.setDate(d.getDate()-1); }
      else break;
    }
    return streak;
  }

  function renderStreak() {
    const streak = calcStreak();
    const today = new Date();
    const todayKey = today.getFullYear() + '/' + (today.getMonth()+1) + '/' + today.getDate();
    const hasToday = state.records.some(r => r.date === todayKey);
    const titleEl = document.getElementById('streak-title');
    const subEl = document.getElementById('streak-sub');
    const fireEl = document.getElementById('streak-fire');
    if (streak >= 7) fireEl.textContent = '🔥🔥';
    else if (streak >= 3) fireEl.textContent = '🔥';
    else fireEl.textContent = '💪';
    titleEl.textContent = streak > 0 ? '連續 ' + streak + ' 天有紀錄！' : '開始你的連勝吧！';
    subEl.textContent = hasToday ? '今天已有紀錄，繼續保持！' : '今天還沒有紀錄，加油！';
  }

  function renderJarName() {
    const name = state.currentJarName || ('第 ' + state.currentJarNum + ' 罐');
    document.getElementById('jar-name-display').textContent = name;
    document.getElementById('jar-name-input').value = name;
  }

  function editJarName() {
    document.getElementById('jar-name-display').style.display = 'none';
    const inp = document.getElementById('jar-name-input');
    inp.style.display = 'inline-block';
    inp.focus();
    inp.select();
  }

  function saveJarName() {
    const val = document.getElementById('jar-name-input').value.trim();
    state.currentJarName = val;
    save();
    document.getElementById('jar-name-input').style.display = 'none';
    document.getElementById('jar-name-display').style.display = '';
    renderJarName();
  }

  function render() {
    const records = state.records;
    const total = records.reduce((s, r) => s + r.amount, 0);
    const count = records.length;
    const maxVal = count ? Math.max(...records.map(r => r.amount)) : 0;
    const pct = Math.min(total / GOAL, 1);
    const pctLabel = Math.round(pct * 100);

    document.getElementById('s-total').textContent = '$' + total.toLocaleString();
    document.getElementById('s-count').textContent = count;
    document.getElementById('s-max').textContent = count ? '$' + maxVal.toLocaleString() : '—';
    document.getElementById('goal-label').textContent = '$' + total.toLocaleString() + ' / $' + GOAL.toLocaleString();
    document.getElementById('goal-bar').style.width = Math.min(pct * 100, 100).toFixed(1) + '%';

    document.getElementById('gs1').setAttribute('offset', pct.toFixed(3));
    document.getElementById('gs2').setAttribute('offset', pct.toFixed(3));
    document.getElementById('jar-pct').textContent = pctLabel + '%';
    document.getElementById('jar-total').textContent = pct >= 1 ? '滿罐！' : ('$' + total.toLocaleString());

    ['m25','m50','m75','m100'].forEach((id, i) => {
      const thresholds = [0.25, 0.5, 0.75, 1.0];
      document.getElementById(id).classList.toggle('reached', pct >= thresholds[i]);
    });

    renderStreak();
    renderJarName();
    renderCompleted();
    renderLog(records, count);
  }

  function renderCompleted() {
    const sec = document.getElementById('completed-section');
    const jars = document.getElementById('completed-jars');
    if (!state.completedJars.length) { sec.style.display = 'none'; return; }
    sec.style.display = '';
    jars.innerHTML = '';
    state.completedJars.forEach(j => {
      const el = document.createElement('div');
      el.className = 'completed-jar';
      el.innerHTML = `<div class="cj-icon">🏺</div><div class="cj-info"><div class="cj-name">${j.name}</div><div class="cj-meta">$${j.total.toLocaleString()} · ${j.count} 筆 · ${j.date}</div></div>`;
      jars.appendChild(el);
    });
  }

  function renderLog(records, count) {
    const list = document.getElementById('log-list');
    const header = document.getElementById('log-header');
    list.innerHTML = '';
    if (count === 0) {
      header.textContent = '';
      list.innerHTML = '<div class="empty"><span class="empty-icon">🐷</span>還沒有紀錄<br>快去抵抗第一個慾望吧！</div>';
      return;
    }
    header.textContent = '本罐紀錄（共 ' + count + ' 筆）';
    [...records].reverse().forEach((r, ri) => {
      const idx = records.length - 1 - ri;
      const el = document.createElement('div');
      el.className = 'log-item';
      el.innerHTML = `<div class="log-icon">💰</div><div class="log-info"><div class="log-name">${r.name || '無名慾望'}</div><div class="log-date">${r.date}</div></div><div class="log-amount">+$${r.amount.toLocaleString()}</div><button class="log-del" onclick="deleteItem(${idx})" aria-label="刪除">×</button>`;
      list.appendChild(el);
    });
  }

  function launchConfetti() {
    const colors = ['#2B5BE0','#D4920A','#E03A2B','#1A7A4A','#8B2FC9','#E05F2B'];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.cssText = `
        left: ${Math.random() * 100}vw;
        top: -10px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        width: ${6 + Math.random() * 8}px;
        height: ${6 + Math.random() * 8}px;
        animation-duration: ${1.5 + Math.random() * 1.5}s;
        animation-delay: ${Math.random() * 0.5}s;
      `;
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 3500);
    }
  }

  function showFullOverlay(jarNum) {
    document.getElementById('next-jar-num').textContent = jarNum + 1;
    document.getElementById('full-overlay').classList.add('show');
  }

  function startNewJar() {
    document.getElementById('full-overlay').classList.remove('show');
    const total = state.records.reduce((s, r) => s + r.amount, 0);
    const name = state.currentJarName || ('第 ' + state.currentJarNum + ' 罐');
    const today = new Date();
    const dateStr = today.getFullYear() + '/' + (today.getMonth()+1) + '/' + today.getDate();
    state.completedJars.push({ name, total, count: state.records.length, date: dateStr });
    state.currentJarNum = state.completedJars.length + 1;
    state.currentJarName = '';
    state.records = [];
    save();
    render();
    showToast('第 ' + state.currentJarNum + ' 罐開始！繼續加油 💪');
  }

  let prevTotal = state.records.reduce((s,r)=>s+r.amount,0);
  const prevMilestones = { 25: false, 50: false, 75: false };
  function checkMilestones(oldTotal, newTotal) {
    const milestones = [
      { pct: 0.25, msg: '⚡ 達成 25%！繼續保持！' },
      { pct: 0.50, msg: '🌟 一半了！你太厲害了！' },
      { pct: 0.75, msg: '🔥 75%！最後衝刺！' },
    ];
    milestones.forEach(m => {
      if (oldTotal < GOAL * m.pct && newTotal >= GOAL * m.pct) {
        setTimeout(() => showToast(m.msg), 400);
      }
    });
    if (oldTotal < GOAL && newTotal >= GOAL) {
      launchConfetti();
      setTimeout(() => showFullOverlay(state.currentJarNum), 600);
    }
  }

  function addItem() {
    const name = document.getElementById('item-name').value.trim();
    const amount = parseInt(document.getElementById('item-amount').value);
    if (!amount || amount <= 0) { document.getElementById('item-amount').focus(); showToast('請輸入金額'); return; }
    const oldTotal = state.records.reduce((s, r) => s + r.amount, 0);
    const now = new Date();
    const date = now.getFullYear() + '/' + (now.getMonth()+1) + '/' + now.getDate();
    state.records.push({ name, amount, date });
    save();
    document.getElementById('item-name').value = '';
    document.getElementById('item-amount').value = '';
    const newTotal = oldTotal + amount;
    checkMilestones(oldTotal, newTotal);
    render();
    if (newTotal < GOAL) showToast('已存入 $' + amount.toLocaleString() + ' 🎉');
  }

  function deleteItem(idx) {
    if (!confirm('確定要刪除這筆紀錄？')) return;
    state.records.splice(idx, 1);
    save();
    render();
  }

  document.getElementById('item-amount').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  document.getElementById('item-name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('item-amount').focus(); });

  // render called after login

  // ── Firebase ──
  import('https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js').then(({initializeApp}) => {
    const app = initializeApp({
      apiKey: "AIzaSyBqcw84BbcpPOouQiv9q1hBmavO3g8so3E",
      authDomain: "desirejar-9af38.firebaseapp.com",
      projectId: "desirejar-9af38",
      storageBucket: "desirejar-9af38.firebasestorage.app",
      messagingSenderId: "168150858549",
      appId: "1:168150858549:web:6e82c0c852d3a07001ea7c"
    });

    import('https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js').then(({
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
    }) => {
      const auth = getAuth(app);

      onAuthStateChanged(auth, user => {
        document.getElementById('auth-loading').classList.add('hidden');
        if (user) {
          currentUser = user;
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('app-screen').classList.add('visible');
          startListening();
        } else {
          currentUser = null;
          document.getElementById('login-screen').classList.remove('hidden');
          document.getElementById('app-screen').classList.remove('visible');
        }
      });

      window.doAuth = async function() {
        const email = document.getElementById('auth-email').value.trim();
        const pw = document.getElementById('auth-password').value;
        const errEl = document.getElementById('auth-err');
        errEl.textContent = '';
        if (!email || !pw) { errEl.textContent = '請輸入信箱和密碼'; return; }
        try {
          await signInWithEmailAndPassword(auth, email, pw);
        } catch(e) {
          const msgs = {
            'auth/invalid-email': '信箱格式不正確',
            'auth/user-not-found': '找不到此帳號',
            'auth/wrong-password': '密碼錯誤',
            'auth/invalid-credential': '信箱或密碼錯誤',
            'auth/weak-password': '密碼至少需要 6 個字元',
          };
          errEl.textContent = msgs[e.code] || '發生錯誤：' + e.code;
        }
      };

      window.doLogout = async function() {
        await signOut(auth);
        state = { records: [], completedJars: [], currentJarName: '', currentJarNum: 1 };
        document.getElementById('app-screen').classList.remove('visible');
        document.getElementById('login-screen').classList.remove('hidden');
      };

      ['auth-email','auth-password'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
          if (e.key === 'Enter') window.doAuth();
        });
      });
    });
  });

  // ── Service Worker 註冊 ──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // ── 安裝提示 (A2HS) ──
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById('install-btn');
    if (btn) btn.style.display = 'block';
  });
  window.triggerInstall = function() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(() => {
      deferredInstallPrompt = null;
      const btn = document.getElementById('install-btn');
      if (btn) btn.style.display = 'none';
    });
  };
  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('install-btn');
    if (btn) btn.style.display = 'none';
    deferredInstallPrompt = null;
  });
</script>

</div><!-- /app-screen -->
</body>
</html>
